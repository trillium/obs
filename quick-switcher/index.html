<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick Switcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; --bg: rgba(20,22,30,.96); --panel: #232733;
    --text: #e8eaf0; --muted: #9aa0b4; --accent: #7ee787; --sel: #2f3a2f; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #101218; color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }
  #palette { width: 620px; max-width: 92vw; background: var(--bg);
    border: 1px solid #333a4d; border-radius: 12px; overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,.6); }
  #q { width: 100%; padding: 16px 18px; font-size: 20px; background: transparent;
    border: 0; border-bottom: 1px solid #333a4d; color: var(--text); outline: none; }
  #list { max-height: 380px; overflow-y: auto; padding: 6px; }
  .item { padding: 9px 12px; border-radius: 8px; cursor: pointer;
    display: flex; gap: 10px; align-items: baseline; }
  .item.sel { background: var(--sel); }
  .item .kind { font-size: 11px; letter-spacing: .12em; color: var(--accent);
    text-transform: uppercase; min-width: 86px; }
  .item .name { flex: 1; }
  .item .hint { font-size: 12px; color: var(--muted); }
  #status { padding: 8px 14px; font-size: 12px; color: var(--muted);
    border-top: 1px solid #333a4d; display: flex; gap: 14px; }
  #status .ok { color: var(--accent); } #status .bad { color: #f85149; }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid #333a4d; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; display: none; }
</style>
</head>
<body>
<div id="palette">
  <input id="q" type="text" placeholder="Type a scene, effect, or command…" autocomplete="off" spellcheck="false">
  <div id="list"></div>
  <div id="status"><span id="st-firebot">firebot…</span><span id="st-obs">obs…</span><span id="st-count"></span></div>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
