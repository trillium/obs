<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px;
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0e0e0e;
    font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .container {
    text-align: center;
  }
  h1 {
    font-size: 96px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 40px;
  }
  .timer {
    font-size: 144px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: 8px;
    opacity: 0.9;
  }
  .timer.urgent {
    color: #ff4444;
    animation: pulse 1s ease-in-out infinite;
  }
  .subtitle {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.4;
    margin-top: 40px;
    margin-bottom: 50px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 0.5; }
  }
  .socials {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
  }
  .social {
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0.6;
  }
  .social .icon { font-size: 24px; }
  .social .platform {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #888;
  }
  .social .handle {
    font-size: 18px;
    color: #ccc;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Starting Soon</h1>
    <div class="timer" id="timer">--:--</div>
    <div class="subtitle">stream begins shortly</div>
    <div class="socials">
      <div class="social">
        <span class="icon">🦋</span>
        <div><div class="platform">Bluesky</div><div class="handle">@trillium.is</div></div>
      </div>
      <div class="social">
        <span class="icon">🐙</span>
        <div><div class="platform">GitHub</div><div class="handle">trillium</div></div>
      </div>
      <div class="social">
        <span class="icon">💼</span>
        <div><div class="platform">LinkedIn</div><div class="handle">/in/trilliumsmith</div></div>
      </div>
      <div class="social">
        <span class="icon">📺</span>
        <div><div class="platform">YouTube</div><div class="handle">@Trillium_is</div></div>
      </div>
      <div class="social">
        <span class="icon">🎮</span>
        <div><div class="platform">Twitch</div><div class="handle">trilliumsmith</div></div>
      </div>
    </div>
  </div>
  <script>
    const CONFIG_PATH = 'file:///Users/trilliumsmith/code/obs/overlays/countdown.txt';
    let remaining = 0;
    let ticking = false;

    const timerEl = document.getElementById('timer');

    function render() {
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      timerEl.textContent = m + ':' + String(s).padStart(2, '0');
      timerEl.classList.toggle('urgent', remaining <= 60 && remaining > 0);
    }

    function tick() {
      if (remaining <= 0) {
        timerEl.textContent = 'LIVE';
        timerEl.classList.remove('urgent');
        ticking = false;
        return;
      }
      render();
      remaining--;
      setTimeout(tick, 1000);
    }

    function parseTime(text) {
      const clean = text.trim();
      const parts = clean.split(':');
      if (parts.length === 2) {
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
      }
      return parseInt(parts[0], 10) * 60;
    }

    async function checkConfig() {
      try {
        const resp = await fetch(CONFIG_PATH + '?_=' + Date.now());
        const text = await resp.text();
        const newTime = parseTime(text);
        if (newTime > 0 && !ticking) {
          remaining = newTime;
          ticking = true;
          tick();
        }
      } catch (e) {}
    }

    setInterval(checkConfig, 2000);
    checkConfig();
  </script>
</body>
</html>
