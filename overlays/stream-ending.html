<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px;
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0e0e0e;
    font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .container {
    text-align: center;
  }
  h1 {
    font-size: 96px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 40px;
  }
  .subtitle {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.4;
    margin-top: 40px;
    margin-bottom: 50px;
  }
  .socials {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
  }
  .social {
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0.6;
  }
  .social .icon { font-size: 24px; }
  .social .platform {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #888;
  }
  .social .handle {
    font-size: 18px;
    color: #ccc;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Thanks for Watching</h1>
    <div class="subtitle">see you next time</div>
    <div class="socials">
      <div class="social">
        <span class="icon">🦋</span>
        <div><div class="platform">Bluesky</div><div class="handle">@trillium.is</div></div>
      </div>
      <div class="social">
        <span class="icon">🐙</span>
        <div><div class="platform">GitHub</div><div class="handle">trillium</div></div>
      </div>
      <div class="social">
        <span class="icon">💼</span>
        <div><div class="platform">LinkedIn</div><div class="handle">/in/trilliumsmith</div></div>
      </div>
      <div class="social">
        <span class="icon">📺</span>
        <div><div class="platform">YouTube</div><div class="handle">@Trillium_is</div></div>
      </div>
      <div class="social">
        <span class="icon">🎮</span>
        <div><div class="platform">Twitch</div><div class="handle">trilliumsmith</div></div>
      </div>
    </div>
  </div>
</body>
</html>
